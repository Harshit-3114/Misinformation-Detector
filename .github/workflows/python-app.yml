name: Python application

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    - uses: actions/checkout@v7

    - name: Set up Python 3.10
      uses: actions/setup-python@v7
      with:
        python-version: "3.10"
        cache: pip
        cache-dependency-path: |
          requirements.txt
          requirements-dev.txt

    - name: Install CPU-only PyTorch
      # The default PyPI wheel pulls in the CUDA runtime and several GB of
      # NVIDIA libraries. This project never trains on a GPU, so the CPU
      # wheel is enough and keeps the job fast.
      run: |
        python -m pip install --upgrade pip
        pip install torch --index-url https://download.pytorch.org/whl/cpu

    - name: Install dependencies
      run: |
        pip install -r requirements.txt
        pip install -r requirements-dev.txt

    - name: Install the spaCy model
      # `models/claim_detector.py` loads en_core_web_sm at import time.
      run: python -m spacy download en_core_web_sm

    - name: Lint with flake8
      run: |
        # Stop the build on syntax errors and undefined names.
        flake8 . --count --select=E9,F63,F7,F82 --show-source --statistics
        # Everything else is reported as a warning.
        flake8 . --count --exit-zero --max-complexity=10 --max-line-length=127 --statistics

    - name: Test with pytest
      run: pytest -v --tb=short
